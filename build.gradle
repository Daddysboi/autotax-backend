plugins {
    id 'org.springframework.boot' version '3.2.5' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

ext {
    springBootVersion = '3.2.5'
    springVersion = '6.1.5'
    springDataVersion = '3.2.5'
    junitVersion = '5.10.1'
    servletVersion = '6.0.0'
    lombokVersion = '1.18.32'
    autoTaxCommonsVersion = '0.3.2'
    queryDslVersion = '5.0.0' // Reverted to the correct, existing version
    jacksonVersion = '2.17.1'
    springDocVersion = '2.3.0'
    swaggerAnnotationsVersion = '2.2.21'
    retrofitVersion = '2.9.0'
    okhttpVersion = '4.12.0'
    poiVersion = '5.2.5'
    keycloakVersion = '23.0.7'
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.autotax'
    version = '0.0.1-SNAPSHOT'

    sourceCompatibility = '17'
    targetCompatibility = '17'

    repositories {
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }

    configurations.all {
        resolutionStrategy {
            // Force a specific version of nimbus-jose-jwt to prevent classpath conflicts
            force 'com.nimbusds:nimbus-jose-jwt:9.37'
            eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'com.nimbusds' && details.requested.name == 'nimbus-jose-jwt') {
                    details.useVersion '9.37'
                }
            }
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        implementation 'com.mysema.commons:mysema-commons-lang:0.2.4'
        // Test dependencies will be managed by test-starter for most modules
    }

    test {
        useJUnitPlatform()
    }
}

project(':domain') {
    bootJar.enabled = false
    dependencies {
        implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
        implementation "com.querydsl:querydsl-jpa:${queryDslVersion}:jakarta"
        annotationProcessor "com.querydsl:querydsl-apt:${queryDslVersion}:jakarta"
    }

    // Configure QueryDSL annotation processor
    tasks.withType(JavaCompile) {
        options.annotationProcessorGeneratedSourcesDirectory = file("build/generated/sources/annotationProcessor/java/main")
        options.compilerArgs += [
            "-Aquerydsl.entityAccessors=true",
            "-Aquerydsl.createEnumPath=true"
        ]
    }
}

project(':web') {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation project(':controller')
        implementation project(':service-impl')
        implementation project(':integration-impl')

        // Security
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation "org.keycloak:keycloak-spring-boot-starter:${keycloakVersion}"

        // OpenAPI Documentation
        implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springDocVersion}"

        // Production-ready features
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-aop'

        // Database
        runtimeOnly 'org.postgresql:postgresql'
    }
}

project(':controller') {
    dependencies {
        implementation project(':service')
        implementation project(':domain')
    }
}

project(':service-impl') {
    dependencies {
        implementation project(':service')
        implementation project(':dao')
        implementation project(':integration')
        implementation "org.keycloak:keycloak-admin-client:${keycloakVersion}"
        implementation 'com.google.code.gson:gson:2.10.1'
        implementation 'org.apache.commons:commons-lang3:3.14.0'
        implementation "org.keycloak:keycloak-spring-boot-starter:${keycloakVersion}"
    }
}

project(':service') {
    dependencies {
        implementation project(':domain')
    }
}

project(':dao') {
    dependencies {
        implementation project(':domain')
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    }
}

project(':integration-impl') {
    dependencies {
        implementation project(':integration')
    }
}

project(':integration') {
    dependencies {
        implementation project(':domain')
    }
}

project(':report') {
    dependencies {
        implementation project(':domain')
    }
}

project(':infrastructure') {
    dependencies {
        implementation project(':domain')
    }
}

project(':test-starter') {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-test'
        runtimeOnly 'com.h2database:h2'
    }
}
